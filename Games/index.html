<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Games</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="games.css">
  <script>
    /* Games is desktop only: phones and narrow windows go back to the home page */
    if (!matchMedia("(min-width: 900px)").matches) location.replace("../index.html");
  </script>
</head>
<body>
  <header class="topbar wide animate">
    <button class="icon-btn" data-href="../index.html" aria-label="Back">
      <img src="../Assets/Pictures/back.png" alt="">
    </button>
    <div class="search">
  <input type="search" autocomplete="off" required/>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1000 150">
    <path class="path" fill="none" d="M924.4 85.2c-19.5 19.5-50.8 19.7-70.3 0-19.3-19.4-19.3-51 .3-70.6 19.5-19.5 51-19.4 70.6 0 19.3 19.7 19.3 50.8-.5 70.6l35.4 35.3H0"/>
  </svg>
</div>
  </header>

  <main class="page wide">
    <div id="grid" class="game-grid"></div>
    <p id="search-empty" class="search-empty" hidden>Nothing found.</p>

    <div class="to-top-wrap">
      <button id="to-top" class="icon-btn" aria-label="Back to top">
        <img src="../Assets/Pictures/up.png" alt="">
      </button>
    </div>
  </main>

  <script src="../script.js"></script>
  <script src="script.js"></script>
</body>
</html>
