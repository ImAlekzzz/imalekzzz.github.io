<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      var nav = performance.getEntriesByType("navigation")[0];
      var reloaded = nav && nav.type === "reload";
      var backForward = nav && nav.type === "back_forward";
      var fromSite = document.referrer && new URL(document.referrer).origin === location.origin;
      if (!matchMedia("(min-width: 900px)").matches || backForward || (fromSite && !reloaded)) {
        document.documentElement.classList.add("started");
      }
    } catch (e) {}
  </script>
</head>
<body class="home">
  <div id="intro" class="intro" role="button" tabindex="0" aria-label="Click or press Enter to start">
    <video class="intro-art" src="Assets/Videos/hole.mp4" autoplay loop muted playsinline disablepictureinpicture aria-hidden="true"></video>
    <p class="intro-hint">Click or press Enter</p>
  </div>

  <div class="stage">
    <svg id="solar" aria-hidden="true"></svg>
    <div class="solar-hi" aria-hidden="true">Hi</div>
    <div id="box" class="container">
      <button class="animate" data-href="About/index.html">About</button>
      <button class="animate" data-href="Projects/index.html">Projects</button>
      <button class="animate" data-href="Links/index.html">Links</button>
      <button class="animate" data-href="Socials/index.html">Socials</button>
      <button class="animate" data-href="Attributions/index.html">Attributions</button>
      <button class="animate desktop-only" data-href="Games/index.html">Games</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
